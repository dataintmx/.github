name: "🧹 Maintenance"
description: Dependencies, refactors, CI/CD, documentation or other upkeep.
title: "[CHORE]: "
labels: ["Type: Maintenance", "Status: Unresolved", "Priority: Low"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of work
      options:
        - Dependencies
        - Refactor
        - CI/CD
        - Documentation
        - Security hardening
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What and why
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      placeholder: |
        - [ ] ...
    validations:
      required: true
  - type: input
    id: notion
    attributes:
      label: Notion task
    validations:
      required: false
